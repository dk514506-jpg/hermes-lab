# ===========================================================================
# triage.yaml — FAOS + HOMES + See-R + Astral Persona Integrated Pipeline
#
# This file extends the hermes-multi-agent-workflow skeleton with:
#   - FAOS: field model, shadow route, task abstraction, instrumented close,
#           dissent requirement, evidence ladder, perception window
#   - HOMES: ambient sensing state, hardware topology, CSI telemetry refs
#   - See-R: epistemic provenance, source inventory, quarantine discipline
#   - Astral Persona: Capricorn-Scorpio-Taurus-Pisces behavioral governance
#
# Principle: every extension is DATA (new YAML blocks), not engine code.
# Engine changes (new methods on TriageEngine) are mechanical translations
# of these data structures into task specs — no domain logic in Python.
#
# Reference documents:
#   ~/.hermes/hermes-agent/docs/Ideal_Research_Assistant_Operating_Guide.txt
#   ~/.hermes/hermes-agent/docs/Real_World_Relational_Procedural_Operating_System_Design_Memo.txt
#   ~/.hermes/hermes-agent/docs/HOMES core - master implementation plan.pdf
#   ~/.hermes/hermes-agent/docs/See-R_Knowledge_Base_Workbook_Governance_and_Design_Rationale.docx
#   .hermes/skills/astral-research-harness/SKILL.md
# ===========================================================================

# ---------------------------------------------------------------------------
# PIPELINE IDENTITY
# ---------------------------------------------------------------------------
name: persona-research-pipeline
schema_version: faos-integration/2.0
board: persona-research
workspace_root: ./work
cost_gate_usd: 3.50

# ---------------------------------------------------------------------------
# FAOS EXTENSION: FIELD PERCEPTION WINDOW
# FAOS §6.1: Model the situation before choosing a procedure.
# Enables the scout to output a relational graph, not just flat fields.
# ---------------------------------------------------------------------------
perception:
  enabled: true
  required_outputs:
    - observed_entities          # what actors, objects, signals are present
    - explicit_request           # what the user or system is demanding
    - active_constraints         # hardware limits, API availability, time bounds
    - ambiguities                # what is unclear or contested
    - competing_interpretations  # different frames the data could support
    - potential_stakes           # what is at risk if wrong
    - missing_information        # what would be needed to decide
    - known_hazards              # contamination risk, premature abstraction
    - evidence_sources           # where each observation came from
  prohibition: "Do not select a solution during field capture unless immediate action is required by a preauthorized emergency rule."

# ---------------------------------------------------------------------------
# FAOS EXTENSION: FIELD MODEL
# FAOS §5.1: Relational world model.
# Entities, relations, and stakes that the system can perceive and track.
# Extends item_schema.fields with structural knowledge.
# ---------------------------------------------------------------------------
field_model:
  entity_types:
    - name: persona_profile
      attributes: [planet, version, completeness, source_status]
    - name: generation_run
      attributes: [model, quant, context_window, peak_vram_mb]
    - name: scoring_result
      attributes: [judge_model, total_score, per_dimension_breakdown]
    - name: bridge_loader
      attributes: [script_version, leakage_check_passed, yaml_path]
    - name: csv_output
      attributes: [row_count, field_count, file_size_bytes, sha256]
    - name: hardware_topology
      attributes: [gpu_count, vram_per_card_gb, backend, os]
  relation_types:
    - type: generates
      from: generation_run
      to: csv_output
    - type: evaluated_by
      from: csv_output
      to: scoring_result
    - type: loaded_by
      from: persona_profile
      to: bridge_loader
    - type: provisioned_by
      from: generation_run
      to: hardware_topology
    - type: reveals
      from: scoring_result
      to: persona_profile
      attribute: expression_fidelity
  stakes:
    - id: persona_expression_fidelity
      description: "Does the LLM output carry the intended planetary sensory register, motion texture, and virtue?"
      governed_by: Mercury/Scorpio    # forensic detection of leakage or flattening
      monitored_by: Venus/Taurus      # preservation of source texture
    - id: pipeline_integrity
      description: "Does each stage (bridge → generate → score) pass without speculative compensation?"
      governed_by: Saturn/Capricorn   # method, sequence, evidence standards
      monitored_by: Mars/Capricorn    # cut weak joints before they compound
    - id: knowledge_cumulation
      description: "Are findings quarantined, preserved, and available for subsequent synthesis?"
      governed_by: Jupiter/Moon/Pisces # reception, meaning, pattern
      monitored_by: Sun/Capricorn      # durable output, public standard

# ---------------------------------------------------------------------------
# SOURCES — the scouts (FAOS §6.1 Phase A: Field Perception)
# Each runs on a Hermes profile with the scout skill, on a cron.
# The perception block above enriches what they emit.
# ---------------------------------------------------------------------------
sources:
  - id: bridge-scout
    profile: persona-research
    skill: triage-scout-bridge
    schedule: "0 6 * * *"         # daily at 6am
    query: |
      Inspect the bridge_profile_loader.py for recent changes.
      Check: leakage guard, completeness validation, YAML loading paths.
      Report every change that could affect persona expression fidelity.
      For each finding: entity involved, relation affected, stake threatened,
      evidence source (git commit hash or file diff).

  - id: generation-scout
    profile: persona-research
    skill: triage-scout-generation
    schedule: "30 6 * * *"        # daily at 6:30am (staggered)
    query: |
      Run one test generation per active planet profile through the bridge.
      Compare output CSV against the controlled vocabulary lexicon.
      Flag: missing fields, leakage of forbidden terms, flattened sensory
      register, scoring asymmetries between judge and generator prompts.

  - id: hardware-scout
    profile: persona-research
    skill: triage-scout-hardware
    schedule: "*/15 * * * *"      # every 15 minutes
    query: |
      Read HOMES hub state: VRAM usage on RTX 3060, Ollama process health,
      Zenoh node connectivity, Neo4j hyperedge count, GreptimeDB ingestion
      rate. Report only deviations from baseline — not steady-state noise.

  - id: knowledge-scout
    profile: persona-research
    skill: triage-scout-seer
    schedule: "0 8 * * 1"         # weekly Monday 8am
    query: |
      Audit the See-R knowledge base for: orphaned source entries, stale
      authority maps, unverified thresholds, quarantine register items that
      have exceeded their review window. Report with source anchors and
      operational status flags.

# ---------------------------------------------------------------------------
# ITEM SCHEMA
# Base fields (required by engine) + domain fields for the rubric/router.
# FAOS §6.2: Task abstraction template fields.
# See-R: epistemic provenance level on every claim.
# ---------------------------------------------------------------------------
item_schema:
  fields:
    - title
    - claim
    - sources
    - why_it_may_matter
    - entity_involved
    - relation_affected
    - stake_threatened
    - evidence_level
    - hardware_context
    - urgent

# ---------------------------------------------------------------------------
# FAOS EXTENSION: EVIDENCE LADDER (See-R §7, FAOS §10.1)
# Every claim in the pipeline carries an epistemic provenance level.
# No claim may skip levels (impression → judgment without transit).
# ---------------------------------------------------------------------------
evidence_ladder:
  levels:
    - key: impression
      label: "Field impression"
      allowed_language: "This may suggest..."
      authority: Jupiter/Moon/Pisces
    - key: lead
      label: "Forensic lead"
      allowed_language: "This is a pressure point..."
      authority: Mercury/Scorpio
    - key: fact
      label: "Preserved fact or fragment"
      allowed_language: "The material preserves..."
      authority: Venus/Taurus
    - key: claim
      label: "Method-tested claim"
      allowed_language: "The evidence supports..."
      authority: Saturn/Capricorn
    - key: judgment
      label: "Executed judgment"
      allowed_language: "This should be rejected/central..."
      authority: Sun/Mars/Capricorn
  promotion_rule: "No field impression may be promoted directly to executed judgment. Must pass through Mercury (lead), Venus (fact), and Saturn (claim) first."
  non_skip: true

# ---------------------------------------------------------------------------
# DEDUP
# ---------------------------------------------------------------------------
dedup:
  method: token-cosine
  duplicate_threshold: 0.62
  possible_threshold: 0.40

# ---------------------------------------------------------------------------
# RUBRIC — triage gate (FAOS §6.3)
# The orchestrator scores each dimension 0..max. Sum must reach threshold.
# Dimensions are domain-specific; engine scoring is fully general (LLM mode).
# Each dimension is mapped to a planetary function that governs scoring.
# ---------------------------------------------------------------------------
rubric:
  threshold: 60
  dimensions:
    - key: persona_impact
      max: 30
      hint: "How much does this degrade persona expression fidelity? (leaked terms, flattened register, scoring asymmetry)"
      planetary_governor: Mercury/Scorpio
    - key: pipeline_confidence
      max: 25
      hint: "How certain are we that this is a real defect vs. instrumentation noise? (reproducible, source-anchored)"
      planetary_governor: Saturn/Capricorn
    - key: fix_cost
      max: 20
      hint: "Effort to correct — code change, config change, re-tuning, or documentation?"
      planetary_governor: Mars/Capricorn
    - key: knowledge_value
      max: 15
      hint: "Does fixing this reveal something we should preserve for future pipeline integrity?"
      planetary_governor: Venus/Taurus
    - key: strategic_priority
      max: 10
      hint: "Alignment with current phase objectives (pilot validation, expansion, hardening)"
      planetary_governor: Sun/Capricorn

# ---------------------------------------------------------------------------
# FAOS EXTENSION: TASK ABSTRACTION (FAOS §6.2)
# Each path may declare a formal task frame that the orchestrator uses to
# constrain execution. These are inlined from the path's task abstraction
# template into the worker's body so constraints follow the work.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# RESEARCH LANES — parallel investigation before routing (FAOS §6.4)
# All lanes must finish before route fires (fan-in).
# The classifier_lane emits the value the router reads.
# ---------------------------------------------------------------------------
research_lanes:
  role: researcher
  lanes:
    - diagnose_root_cause
    - assess_blast_radius
    - prior_art_and_history
  classifier_lane: diagnose_root_cause

# ---------------------------------------------------------------------------
# FAOS EXTENSION: ROUTE WITH SHADOW (FAOS §6.4, §7)
# Extended route map: each entry carries a primary path, a monitored shadow,
# conditions under which the shadow should be promoted, and the promotion
# rule (FAOS: only one in-place promotion per task without re-abstraction).
# ---------------------------------------------------------------------------
route:
  classifier: diagnose_root_cause.severity_and_type
  # Valens-derived: authority-weighted resolution (Victor method §I.18).
  # When multiple classification values map to the same primary, the
  # authority_weight field scores each candidate's basis in the item's
  # domain before the primary is confirmed. Mirrors domicile=5/exaltation=4/
  # triplicity=3/bound=2/face=1 — weighted selection that preserves
  # non-winning witnesses (shadow) rather than collapsing them.
  authority_weights:
    bridge_leakage: 5
    generation_flattening: 5
    scoring_asymmetry: 4
    hardware_pressure: 3
    knowledge_gap: 2
    clean: 1
  map:
    bridge_leakage:
      primary: fix-bridge
      shadow: document
      shadow_conditions:
        - "Fix requires architecture change beyond the current phase"
        - "Leakage is in the global term list, not card-specific"
      promotion_rule: single
    generation_flattening:
      primary: fix-generator
      shadow: document
      shadow_conditions:
        - "Flattening is a model-level limitation, not a prompt defect"
        - "Fix would require fine-tuning unavailable on current hardware"
      promotion_rule: single
    scoring_asymmetry:
      primary: fix-scoring
      shadow: document
      shadow_conditions:
        - "Asymmetry is inherent in the judge prompt design (known issue)"
        - "Fix would require a protocol change across the eval suite"
      promotion_rule: single
    hardware_pressure:
      primary: remediate-hardware
      shadow: document
      shadow_conditions:
        - "Pressure is transient (another process will release VRAM)"
        - "Hardware profile is already at the minimum viable rung"
      promotion_rule: single
    knowledge_gap:
      primary: document
      shadow: shelve
      shadow_conditions:
        - "Gap is isolated and non-recurring"
        - "No action required beyond preserving the finding"
      promotion_rule: single
    clean:
      primary: shelve
      shadow: null

# ---------------------------------------------------------------------------
# PATHS — what happens per route outcome (FAOS §6.5-6.11)
# Extended with: task_frame, close requirements, evidence targets.
# Each path maps to a planetary circuit from the astral-research-harness.
# ---------------------------------------------------------------------------
paths:
  # -----------------------------------------------------------------------
  # FIX A BRIDGE LOADER DEFECT
  # Planetary circuit: Saturn → Mercury → Mars → Venus → Sun
  # Fabricator subfunction active (produce working artifact)
  # -----------------------------------------------------------------------
  fix-bridge:
    task_frame:
      success_condition: "Bridge loads all 7 planets, passes leakage guard, passes completeness check."
      non_goals:
        - "Refactoring the bridge architecture"
        - "Adding new planets to the profile set"
      boundaries:
        - "Must not change the bridge's public API (build_generation_prompt signature)"
        - "Leakage guard must remain stricter than before the fix"
      required_evidence: "CI-style verification script output showing all checks pass"
      stakeholders: [user, all_persona_profiles]
      time_horizon: immediate
      reversibility: full
      uncertainty: low
    prep:
      - {stage: diagnose_leakage, role: analyst}
      - {stage: plan_repair, role: analyst}
    propose:
      role: orchestrator
      template: paths/proposals/fix-bridge.md
    fulfill:
      - {stage: implement_repair, role: builder}
      - {stage: verify_fix, role: tester}
      - {stage: update_see_r, role: analyst}
      - {stage: locus_review, role: locus}
    workspace_subdir: bridge-fixes
    scope_rails: paths/rails/bridge-edit.md
    deliverable_spec: paths/specs/bridge-patch.md
    # FAOS: instrumented close requirements
    close:
      required_passes:
        - victory: true
          description: "Leakage guard passes for all 7 planet cards"
        - defect: true
          description: "Any remaining known leak paths documented"
        - dissent: true
          description: "Alternative repair strategies considered and rejected with reason"
        - proxy_check: true
          description: "Did we measure 'guard passes' when the real goal is 'persona fidelity preserved'?"
        - boundary_check: true
          description: "Repair stayed within scope_rails"
        - transfer_status: true
          description: "Repair technique available for similar defects in other loader scripts"

  # -----------------------------------------------------------------------
  # FIX A GENERATION SCRIPT DEFECT
  # Planetary circuit: Mercury → Saturn → Mars → Venus → Sun
  # Fabricator subfunction active
  # -----------------------------------------------------------------------
  fix-generator:
    task_frame:
      success_condition: "Generated CSV for the affected planet contains all 7 persona fields (core_qualities, sensory_register, motion_texture, etc.)"
      non_goals:
        - "Regenerate CSVs for all planets"
        - "Change the question set"
      boundaries:
        - "Must preserve existing 22-question format"
        - "Must not introduce new forbidden_terms"
      required_evidence: "generated CSV passes schema validation"
      stakeholders: [user, evaluation_pipeline]
      time_horizon: immediate
      reversibility: full
      uncertainty: low
    prep:
      - {stage: inspect_generation_path, role: analyst}
      - {stage: identify_flattening_source, role: analyst}
    propose:
      role: orchestrator
      template: paths/proposals/fix-generator.md
    fulfill:
      - {stage: patch_generator, role: builder}
      - {stage: regenerate_test, role: tester}
      - {stage: validate_csv_output, role: tester}
      - {stage: locus_review, role: locus}
    workspace_subdir: generator-fixes
    scope_rails: paths/rails/generator-edit.md
    close:
      required_passes:
        - victory: true
        - defect: true
        - dissent: true
        - proxy_check: true
        - boundary_check: true
        - transfer_status: true

  # -----------------------------------------------------------------------
  # FIX A SCORING ASYMMETRY
  # Planetary circuit: Jupiter → Mercury → Saturn → Sun
  # Reluctant Corrector subfunction may activate (this is a known design issue)
  # -----------------------------------------------------------------------
  fix-scoring:
    task_frame:
      success_condition: "Judge prompt and generation prompt for the same planet draw from the same persona fields"
      non_goals:
        - "Re-running the entire scoring eval suite"
      boundaries:
        - "Must preserve the judge's ability to detect forbidden terms"
        - "Revealing the planet name to the judge is acceptable (judge knows; generator must not)"
      required_evidence: "Side-by-side diff of what each prompt sees per planet"
      stakeholders: [user, evaluation_pipeline, research_integrity]
      time_horizon: this_phase
      reversibility: partial
      uncertainty: medium
    prep:
      - {stage: audit_prompt_symmetry, role: analyst}
      - {stage: design_patch, role: analyst}
    propose:
      role: orchestrator
      template: paths/proposals/fix-scoring.md
    fulfill:
      - {stage: patch_judge_builder, role: builder}
      - {stage: regression_test, role: tester}
      - {stage: update_see_r_evidence, role: analyst}
      - {stage: locus_review, role: locus}
    workspace_subdir: scoring-fixes
    scope_rails: paths/rails/scoring-edit.md
    close:
      required_passes:
        - victory: true
        - defect: true
        - dissent: true
        - proxy_check: true
        - boundary_check: true
        - transfer_status: true

  # -----------------------------------------------------------------------
  # REMEDIATE HARDWARE PRESSURE (HOMES integration)
  # Planetary circuit: Mercury → Saturn → Mars → Venus
  # Fabricator subfunction active
  # -----------------------------------------------------------------------
  remediate-hardware:
    task_frame:
      success_condition: "Ollama VRAM usage is below 11.5 GB and inference latency is acceptable"
      non_goals:
        - "Acquiring new hardware"
      boundaries:
        - "Must not terminate external GPU processes"
        - "Must not reduce context below 2048"
      required_evidence: "nvidia-smi snapshot before and after"
      stakeholders: [homes_hub, ollama_service]
      time_horizon: immediate
      reversibility: full
      uncertainty: medium
    prep:
      - {stage: diagnose_pressure_source, role: analyst}
      - {stage: evaluate_mitigations, role: analyst}
    propose:
      role: orchestrator
      template: paths/proposals/remediate-hardware.md
    fulfill:
      - {stage: apply_mitigation, role: hardware-operator}
      - {stage: verify_stability, role: tester}
      - {stage: update_homes_telemetry, role: analyst}
      - {stage: locus_review, role: locus}
    workspace_subdir: hardware-mitigations
    scope_rails: paths/rails/hardware-safety.md
    close:
      required_passes:
        - victory: true
        - defect: true
        - dissent: true
        - proxy_check: true
        - boundary_check: true
        - transfer_status: true

  # -----------------------------------------------------------------------
  # DOCUMENT A FINDING (See-R knowledge base update)
  # Planetary circuit: Jupiter → Mercury → Venus → Saturn
  # (reception → investigation → preservation → structured output)
  # No Fabricator — this is a knowledge act, not a build act.
  # -----------------------------------------------------------------------
  document:
    task_frame:
      success_condition: "Finding is recorded in See-R workbook with source anchors, evidence level, and operational status"
      non_goals:
        - "Implementing a fix"
      boundaries:
        - "Must include evidence_level from the ladder"
        - "Must include source anchor (commit, log, or diagnostic output)"
      required_evidence: "At least one verifiable observation"
      stakeholders: [seer_kb, future_pipeline_workers]
      time_horizon: flexible
      reversibility: full
      uncertainty: variable
    auto: false
    prep:
      - {stage: capture_finding, role: analyst}
      - {stage: classify_evidence, role: analyst}
    propose:
      role: orchestrator
      template: paths/proposals/document.md
    fulfill:
      - {stage: write_kb_entry, role: analyst}
      - {stage: update_seer_index, role: analyst}
      - {stage: locus_review, role: locus}
    workspace_subdir: documentation
    deliverable_spec: paths/specs/see-r-entry.md
    close:
      required_passes:
        - victory: true
        - defect: true
        - dissent: true
        - proxy_check: true
        - boundary_check: true
        - transfer_status: true

  # -----------------------------------------------------------------------
  # SHELVE — no action needed
  # FAOS §6.8: Close record still required (negative result is still a result)
  # -----------------------------------------------------------------------
  shelve:
    task_frame:
      success_condition: "Item is archived with reason and no further action is needed"
      non_goals: []
      boundaries: []
      required_evidence: "Clean scout report with no actionable defects"
      stakeholders: []
      time_horizon: immediate
      reversibility: full
      uncertainty: none
    auto: false
    prep: []
    propose:
      role: orchestrator
      template: paths/proposals/shelve.md
    fulfill:
      - {stage: archive_no_action, role: analyst}
      - {stage: locus_review, role: locus}
    close:
      required_passes:
        - victory: true
        - defect: true
        - dissent: true
        - proxy_check: true
        - boundary_check: true
        - transfer_status: true

# ---------------------------------------------------------------------------
# ROLES — mapped to Hermes profiles.
# Each role carries its governing planetary circuit from the persona harness.
# Locus is the validator-steward peer (Dallas → Pip → Locus): a dedicated
# role that reviews route validity, shadow promotions, evidence ladder
# compliance, and instrumented-close completeness. Locus never executes
# work — it adjudicates admissibility and transition integrity (FAOS §11.5).
# ---------------------------------------------------------------------------
roles:
  orchestrator: orchestrator       # Sun/Capricorn — durable authority, task completion
  researcher: researcher           # Mercury/Scorpio — forensic investigation
  analyst: analyst                 # Saturn/Capricorn — method, evidence ranking
  builder: builder                 # Mars/Capricorn — disciplined execution
  tester: tester                   # Venus/Taurus — preservation through verification
  hardware-operator: hardware-operator  # HOMES layer — VRAM/telemetry operations
  locus: locus                     # Validator-Steward — route validity, evidence ladder,
                                   # shadow promotion, dissent, close completeness (FAOS §11.5)

# ---------------------------------------------------------------------------
# GATE — single human approval point (FAOS §6.7)
# Extended with dissent requirement (FAOS §6.7: per-task dissent quota)
# Extended with close checks (FAOS §6.8)
# ---------------------------------------------------------------------------
gate:
  channel: telegram
  approve: [approve]
  shelve: [shelve, "reject the rest"]
  modify: [modify]
  # FAOS §6.7: dissent requirement
  dissent_required: true
  dissent_format: |
    Before approving, the orchestrator must record one substantive
    competing interpretation, failure path, or disconfirming observation.
    "No dissent identified" is acceptable only after active testing.

# ---------------------------------------------------------------------------
# FAOS EXTENSION: INSTRUMENTED CLOSE (FAOS §6.8)
# Default close requirements applied to ALL paths unless overridden per-path.
# ---------------------------------------------------------------------------
close:
  default_passes:
    - victory:
        required: true
        description: "What intended transformation occurred?"
    - defect:
        required: true
        description: "What remains wrong, incomplete, fragile, or unresolved?"
    - dissent:
        required: true
        description: "What alternative reading or concern survived?"
    - proxy_check:
        required: true
        description: "Did the measured success correspond to the actual goal, or only to a convenient indicator?"
    - boundary_check:
        required: true
        description: "Did the system remain within permitted scope?"
    - transfer_status:
        required: true
        description: "What may future tasks inherit?"
  result_states:
    - TRUE
    - FALSE
    - PARTIAL
    - INCONCLUSIVE
    - BLOCKED

# ---------------------------------------------------------------------------
# VALENS-DERIVED: ITEM STATE LINEAGE (S0-S9)
# From Book IX reconstruction: no calculated state may become another
# procedure's governing beginning without explicit authorization; promotion
# requires a pre-declared selector; fail-closed halt states are valid
# outputs, never compensated. Maps onto the pipeline item lifecycle.
# ---------------------------------------------------------------------------
state_lineage:
  states:
    S0: source_input          # scout report / raw observation
    S1: normalized            # intake parsed into item schema
    S2: raw_intermediate      # dedup + scoring inputs assembled
    S3: candidate             # passed triage threshold
    S4: qualified             # research lanes complete
    S5: promoted              # route selected, prep begun
    S6: result_conditioned    # fitted to desired outcome — INVALID for validation
    S7: blocked               # halted, needs human/Locus review
    S8: quarantined           # Q-tier register, not operational
    S9: unresolved_candidate_set  # preserved candidates awaiting selector
  promotion_rule: "Promotion (S3/S4→S5) requires a pre-declared prospective selector. No state becomes another procedure's governing beginning without explicit authorization."
  prohibited_edges:
    - "S6 → S5"      # result-conditioned may not re-enter promotion
    - "S8 → S3"      # quarantined may not re-enter triage without Locus
    - "S0 → S5"      # no skipping the lineage
  halt_states: [S6, S7, S8]
  fail_closed: true

# ---------------------------------------------------------------------------
# VALENS-DERIVED: QUARANTINE TIERS (Q0-Q10)
# From the reconstruction: quarantine attaches to CLAIMS, not sources;
# deny-by-default; run cards execute only thin bounded actions. Q-tier
# register replaces the single `shelve` bucket with a graded ladder.
# ---------------------------------------------------------------------------
quarantine_tiers:
  tiers:
    Q0: safe_technical            # usable in baseline runtime
    Q1: historical_archive        # preserved, not operationalized
    Q2: sensitive_context         # context-only, flagged
    Q3: high_risk_particular      # requires Locus gate before use
    Q4: harmful_outcome_class     # abstract to target-interval + event-class only
    Q5: do_not_operationalize     # barred from runtime
    Q6: numeric_candidate         # values unverified — table shell only
    Q7: result_conditioned        # fitted to outcome — validation-blocked
    Q8: contaminated              # spillover/wrong region — retrieval clue only
    Q9: forbidden                 # never referenced except as quarantine record
    Q10: compost                  # discarded safely, lessons preserved
  default_tier: Q0
  deny_by_default: true
  claim_level: true             # quarantine attaches to claims, not whole sources

# ---------------------------------------------------------------------------
# VALENS-DERIVED: TYPED METRICS (VALUE+UNIT+SCALE)
# From Book VII number ontology: a number is not a state until unit, scale,
# parent, operation, source status, and jurisdiction attach. Same integer
# may polymorph across scales, but every re-scale must be explicit.
# ordinal ≠ completed count.
# ---------------------------------------------------------------------------
typed_metrics:
  required_fields: [value, unit, scale, function, source_locus, source_layer, owner]
  scales: [tokens, usd, vrma_mb, score, count, days, hours, items]
  rules:
    - "Every metric carries VALUE+UNIT+SCALE. A rubric score of 60 is meaningless without scale (0-100 vs 0-65) and source (heuristic vs LLM-judged)."
    - "Ordinal ≠ completed count: task index N does not mean N tasks completed. Track started/active/completed/residual separately."
